<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Film Roulette - {% block title %}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap-icons.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block css %} {% endblock %}
</head>
<body>
<!-- header -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container-fluid container">
          <a href="#" class="navbar-brand d-flex align-items-center">
              <span class="logo-circle me-2 color-accent">●</span>
              <span class="oswald-700 color-text-primary">FILM ROULETTE</span>
          </a>
          <button class="navbar-toggler" type="button" data-target="#navbarNav" data-toggle="collapse">
              <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse manrope-600" id="navbarNav">
              <div class="ms-auto d-flex flex-column flex-lg-row align-items-lg-center gap-3 mt-3 mt-lg-0">
                  <a href="#" class="nav-link color-text-primary">Фильмы</a>
                  <a href="#" class="nav-link color-accent">Рулетка</a>
                  <input type="text" class="rounded-pill form-control form-control-sm search-input w-100 w-lg-auto" placeholder="Поиск по названию" name="" id="">
              </div>
          </div>
      </div>
  </nav>
<!-- end header -->

  {% block content %} {% endblock %}


  <script src="{{ url_for('static', filename='js/popper.min.js') }}"></script>
  <script src="{{ url_for('static', filename='js/bootstrap.min.js') }}"></script>
  <script src="{{ url_for('static', filename='js/script.js') }}"></script>


  {% block js %} {% endblock %}

</body>
</html>
